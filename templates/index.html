<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Detector</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    textarea { width: 100%; height: 110px; padding: 8px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 18px; font-size: 16px; cursor: pointer; }
    #system_response { margin-top: 20px; padding: 12px; border-radius: 6px; min-height: 24px; }
    .success { background: #e6f4ea; color: #1e4620; }
    .error { background: #fdecea; color: #7a1c14; }
  </style>
</head>
<body>
  <h1>Emotion Detector</h1>
  <p>Enter a statement in English and the system will detect its dominant emotion.</p>
  <textarea id="textToAnalyze" placeholder="Type your text here..."></textarea>
  <br>
  <button type="button" onclick="runEmotionDetector()">Run Sentiment Analysis</button>
  <div id="system_response"></div>
  <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
